<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Nodes -->
  <rect x="50" y="150" width="120" height="50" rx="8" fill="#1f6feb" filter="url(#glow)"/>
  <text x="110" y="179" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">START</text>
  
  <rect x="230" y="80" width="140" height="50" rx="8" fill="#238636"/>
  <text x="300" y="109" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">coordinator</text>
  <text x="300" y="124" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">llm node</text>
  
  <rect x="230" y="180" width="140" height="50" rx="8" fill="#238636"/>
  <text x="300" y="209" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">analyst_0</text>
  <text x="300" y="224" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">llm node</text>
  
  <rect x="230" y="280" width="140" height="50" rx="8" fill="#238636"/>
  <text x="300" y="309" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">analyst_1</text>
  <text x="300" y="324" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">llm node</text>
  
  <rect x="430" y="130" width="70" height="50" rx="8" fill="#a371f7"/>
  <text x="465" y="159" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">join</text>
  
  <rect x="560" y="130" width="120" height="50" rx="8" fill="#d29922"/>
  <text x="620" y="159" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">synthesize</text>
  <text x="620" y="174" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">llm node</text>
  
  <rect x="730" y="150" width="50" height="50" rx="8" fill="#da3633" filter="url(#glow)"/>
  <text x="755" y="179" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">END</text>

  <!-- Edges with arrows -->
  <line x1="170" y1="175" x2="225" y2="108" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="105" x2="425" y2="148" stroke="#58a6ff" stroke-width="2"/>
  <line x1="370" y1="205" x2="425" y2="163" stroke="#58a6ff" stroke-width="2"/>
  <line x1="370" y1="305" x2="425" y2="175" stroke="#58a6ff" stroke-width="2"/>
  <line x1="500" y1="155" x2="555" y2="155" stroke="#3fb950" stroke-width="2"/>
  <line x1="680" y1="155" x2="725" y2="170" stroke="#da3633" stroke-width="2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="400" y="370" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">Parallel fan-out with 3 analysts → join → synthesize</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="480">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>

  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="16" font-weight="bold">Graph Lifecycle → Execution → Approval → Verification</text>

  <!-- Row 1: Graph Lifecycle -->
  <rect x="20" y="55" width="200" height="60" rx="8" fill="#1f6feb"/>
  <text x="120" y="78" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_create</text>
  <text x="120" y="96" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Register from spec or template</text>
  <rect x="230" y="55" width="180" height="60" rx="8" fill="#1f6feb"/>
  <text x="320" y="78" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_inspect</text>
  <text x="320" y="96" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Topology + Mermaid diagram</text>
  <rect x="420" y="55" width="160" height="60" rx="8" fill="#1f6feb"/>
  <text x="500" y="78" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_list</text>
  <text x="500" y="96" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Registered graphs</text>
  <rect x="590" y="55" width="170" height="60" rx="8" fill="#1f6feb"/>
  <text x="675" y="78" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_render</text>
  <text x="675" y="96" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Mermaid or JSON</text>

  <!-- Row 2: Execution -->
  <rect x="20" y="140" width="200" height="60" rx="8" fill="#238636"/>
  <text x="120" y="163" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_execute</text>
  <text x="120" y="181" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Sync (blocking) execution</text>
  <rect x="230" y="140" width="180" height="60" rx="8" fill="#238636"/>
  <text x="320" y="163" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_run_start</text>
  <text x="320" y="181" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Async start → run_id</text>
  <rect x="420" y="140" width="160" height="60" rx="8" fill="#238636"/>
  <text x="500" y="163" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_run_wait</text>
  <text x="500" y="181" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Block until terminal</text>
  <rect x="590" y="140" width="170" height="60" rx="8" fill="#da3633"/>
  <text x="675" y="163" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_run_cancel</text>
  <text x="675" y="181" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Cooperative cancel</text>

  <!-- Row 3: State + Checkpoint -->
  <rect x="20" y="225" width="200" height="60" rx="8" fill="#a371f7"/>
  <text x="120" y="248" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_run_state</text>
  <text x="120" y="266" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Live state projection</text>
  <rect x="230" y="225" width="180" height="60" rx="8" fill="#a371f7"/>
  <text x="320" y="248" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_run_checkpoint</text>
  <text x="320" y="266" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Durable checkpoint read</text>
  <rect x="420" y="225" width="160" height="60" rx="8" fill="#a371f7"/>
  <text x="500" y="248" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_run_resume</text>
  <text x="500" y="266" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Atomic one-shot resume</text>
  <rect x="590" y="225" width="170" height="60" rx="8" fill="#a371f7"/>
  <text x="675" y="248" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_run_events</text>
  <text x="675" y="266" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Replay event stream</text>

  <!-- Row 4: HITL + Evidence -->
  <rect x="20" y="310" width="200" height="60" rx="8" fill="#d29922"/>
  <text x="120" y="333" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_approval_*</text>
  <text x="120" y="351" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">list · get · request</text>
  <rect x="230" y="310" width="180" height="60" rx="8" fill="#d29922"/>
  <text x="320" y="333" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_source_witness_*</text>
  <text x="320" y="351" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">capture · get (HMAC-auth)</text>
  <rect x="420" y="310" width="160" height="60" rx="8" fill="#1f6feb"/>
  <text x="500" y="333" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_template_*</text>
  <text x="500" y="351" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">list · instantiate · outcomes</text>
  <rect x="590" y="310" width="170" height="60" rx="8" fill="#1f6feb"/>
  <text x="675" y="333" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">graph_policy_check</text>
  <text x="675" y="351" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Preflight validation</text>

  <!-- Row 5: Receipt -->
  <rect x="220" y="395" width="460" height="55" rx="10" fill="#a371f733" stroke="#a371f7" stroke-width="2" filter="url(#glow)"/>
  <text x="450" y="418" text-anchor="middle" fill="#a371f7" font-family="monospace" font-size="13" font-weight="bold">graph_run_receipt</text>
  <text x="450" y="438" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">Canonical execution receipt — HMAC-SHA256 authenticated, budget counters, model labels, step digest chain</text>
</svg>

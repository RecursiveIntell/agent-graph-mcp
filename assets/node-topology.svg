<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="480">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <text x="450" y="25" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="15" font-weight="bold">8 Node Types — How They Connect</text>

  <!-- Row 1: Entry Points -->
  <rect x="30" y="55" width="155" height="70" rx="10" fill="#1f6feb33" stroke="#1f6feb" stroke-width="2"/>
  <text x="107" y="80" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold">llm</text>
  <text x="107" y="98" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">LLM invocation</text>
  <text x="107" y="114" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">prompt · json_mode · tools</text>

  <rect x="230" y="55" width="155" height="70" rx="10" fill="#a371f733" stroke="#a371f7" stroke-width="2"/>
  <text x="307" y="80" text-anchor="middle" fill="#a371f7" font-family="monospace" font-size="13" font-weight="bold">router</text>
  <text x="307" y="98" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Conditional branching</text>
  <text x="307" y="114" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">path+op+value→targets</text>

  <rect x="430" y="55" width="155" height="70" rx="10" fill="#23863633" stroke="#238636" stroke-width="2"/>
  <text x="507" y="80" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="13" font-weight="bold">parallel</text>
  <text x="507" y="98" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Fan-out dispatch</text>
  <text x="507" y="114" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">JoinSet concurrency</text>

  <rect x="630" y="55" width="155" height="70" rx="10" fill="#d2992233" stroke="#d29922" stroke-width="2"/>
  <text x="707" y="80" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="13" font-weight="bold">join</text>
  <text x="707" y="98" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Fan-in merge</text>
  <text x="707" y="114" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">5 modes · reducers</text>

  <!-- Row 2: Transform / Passthrough -->
  <rect x="80" y="170" width="155" height="70" rx="10" fill="#da363333" stroke="#da3633" stroke-width="2"/>
  <text x="157" y="195" text-anchor="middle" fill="#da3633" font-family="monospace" font-size="13" font-weight="bold">passthrough</text>
  <text x="157" y="213" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">No-op state pass</text>
  <text x="157" y="229" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">fan-out distribution</text>

  <rect x="280" y="170" width="155" height="70" rx="10" fill="#da363333" stroke="#da3633" stroke-width="2"/>
  <text x="357" y="195" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="13" font-weight="bold">state_transform</text>
  <text x="357" y="213" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">10 mutation ops</text>
  <text x="357" y="229" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">set·copy·delete·merge</text>

  <!-- Row 3: Subgraph / HITL -->
  <rect x="480" y="170" width="155" height="70" rx="10" fill="#a371f733" stroke="#a371f7" stroke-width="2"/>
  <text x="557" y="195" text-anchor="middle" fill="#a371f7" font-family="monospace" font-size="13" font-weight="bold">subgraph</text>
  <text x="557" y="213" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Graph composition</text>
  <text x="557" y="229" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">reuse · modularity</text>

  <rect x="680" y="170" width="155" height="70" rx="10" fill="#d2992233" stroke="#d29922" stroke-width="2"/>
  <text x="757" y="195" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="13" font-weight="bold">human_approval</text>
  <text x="757" y="213" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">HITL gate</text>
  <text x="757" y="229" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="9">interrupt · resume</text>

  <!-- Data flow annotations -->
  <rect x="30" y="285" width="840" height="90" rx="8" fill="#1f6feb11" stroke="#1f6feb33" stroke-width="1"/>
  <text x="450" y="310" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12" font-weight="bold">Execution Flow</text>
  <text x="250" y="335" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">START → llm · router · parallel → join · subgraph → human_approval → END</text>
  <text x="680" y="335" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="11">passthrough &amp; state_transform at any position</text>
  <text x="450" y="360" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="10">All nodes carry TraceCtx · AttemptId · TrialId from stack-ids</text>

  <!-- Footer -->
  <rect x="30" y="400" width="840" height="55" rx="10" fill="#23863611" stroke="#23863633" stroke-width="1"/>
  <text x="450" y="422" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="12">Checkpointing</text>
  <text x="450" y="442" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">SQLite persistence · atomic transactions · crash recovery · interrupt/resume · HMAC-SHA256 receipts</text>
</svg>

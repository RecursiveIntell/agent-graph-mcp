<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="390">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="900" height="390" fill="url(#bg)"/>
  <text x="450" y="25" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="15" font-weight="bold">Conceptual Approval and Checkpoint Boundaries</text>
  <text x="450" y="45" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="11" font-weight="bold">ILLUSTRATIVE ONLY — these separate facts are not an end-to-end workflow</text>

  <rect x="30" y="70" width="260" height="110" rx="10" fill="#da363322" stroke="#da3633" stroke-width="2"/>
  <text x="160" y="96" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="13" font-weight="bold">Graph schema fact</text>
  <text x="160" y="121" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">human_approval emits an interrupt</text>
  <text x="160" y="144" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">not resume-eligible</text>

  <rect x="320" y="70" width="260" height="110" rx="10" fill="#d2992222" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="96" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="13" font-weight="bold">Approval request fact</text>
  <text x="450" y="121" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">graph_approval_request</text>
  <text x="450" y="144" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">binds to an existing checkpoint</text>

  <rect x="610" y="70" width="260" height="110" rx="10" fill="#a371f722" stroke="#a371f7" stroke-width="2"/>
  <text x="740" y="96" text-anchor="middle" fill="#a371f7" font-family="monospace" font-size="13" font-weight="bold">Model-facing inspection</text>
  <text x="740" y="121" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">graph_approval_list · graph_approval_get</text>
  <text x="740" y="144" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">metadata only; no decision submission</text>

  <rect x="100" y="215" width="700" height="90" rx="10" fill="#484f5833" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="450" y="248" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="14" font-weight="bold">Decision and resume path omitted</text>
  <text x="450" y="274" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">No model-facing approve/reject operation or end-to-end workflow is asserted here</text>

  <text x="450" y="355" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Checkpoint storage uses daemon SQLite and requires a configured integrity key</text>
</svg>

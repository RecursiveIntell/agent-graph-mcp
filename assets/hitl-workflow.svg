<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="400">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d29922"/></marker>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <text x="450" y="25" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="15" font-weight="bold">Human-in-the-Loop Workflow</text>

  <!-- Step 1 -->
  <rect x="30" y="55" width="180" height="80" rx="10" fill="#1f6feb33" stroke="#1f6feb" stroke-width="2"/>
  <text x="120" y="80" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold">1. Execute Graph</text>
  <text x="120" y="100" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">graph_run_start or</text>
  <text x="120" y="116" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">graph_execute</text>

  <line x1="210" y1="95" x2="260" y2="95" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="265" y="55" width="180" height="80" rx="10" fill="#da363333" stroke="#da3633" stroke-width="2"/>
  <text x="355" y="80" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="13" font-weight="bold">2. Hit human_approval</text>
  <text x="355" y="100" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Graph pauses at</text>
  <text x="355" y="116" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">human_approval node</text>

  <line x1="445" y1="95" x2="495" y2="95" stroke="#da3633" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="500" y="55" width="180" height="80" rx="10" fill="#d2992233" stroke="#d29922" stroke-width="2"/>
  <text x="590" y="80" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="13" font-weight="bold">3. Approval Request</text>
  <text x="590" y="100" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">graph_approval_request</text>
  <text x="590" y="116" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">writes checkpoint</text>

  <line x1="590" y1="135" x2="590" y2="180" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <rect x="450" y="185" width="280" height="60" rx="30" fill="#a371f733" stroke="#a371f7" stroke-width="2"/>
  <text x="590" y="210" text-anchor="middle" fill="#a371f7" font-family="monospace" font-size="13" font-weight="bold">Operator Review</text>
  <text x="590" y="230" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">graph_approval_list · graph_approval_get</text>

  <!-- Approve path -->
  <line x1="450" y1="215" x2="360" y2="280" stroke="#3fb950" stroke-width="2"/>
  <rect x="200" y="280" width="250" height="55" rx="10" fill="#23863633" stroke="#238636" stroke-width="2"/>
  <text x="325" y="303" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="13" font-weight="bold">4a. Approve → Resume</text>
  <text x="325" y="323" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">graph_run_resume · graph continues</text>

  <!-- Reject path -->
  <line x1="730" y1="215" x2="780" y2="280" stroke="#da3633" stroke-width="2"/>
  <rect x="580" y="280" width="250" height="55" rx="10" fill="#da363333" stroke="#da3633" stroke-width="2"/>
  <text x="705" y="303" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="13" font-weight="bold">4b. Reject → Terminal</text>
  <text x="705" y="323" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Graph fails with Interrupted</text>

  <!-- Footer -->
  <text x="450" y="375" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="11">Checkpoint persistence requires AGENT_GRAPH_INTEGRITY_KEY_PATH · Approvals are SQLite-backed, HMAC-SHA256 authenticated</text>
</svg>

[advisories]
# Current cargo-deny enforces vulnerabilities by default. No advisory waivers.
unmaintained = "all"
yanked = "deny"
[bans]
multiple-versions = "warn"
[licenses]
# Explicit operator approval: Unicode-3.0 and CDLA-Permissive-2.0.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "CDLA-Permissive-2.0"]
[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
# Exact revision is additionally enforced by tests/dependency_policy.rs.
allow-git = ["https://github.com/RecursiveIntell/proveKV.git"]

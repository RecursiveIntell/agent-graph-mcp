[package]
name = "agent-graph-mcp"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Run 9 agents at once — MCP server for graph-orchestrated LLM workflows with parallel fan-out (up to 16 nodes), checkpoint/resume, HITL approvals, HMAC receipts"
repository = "https://github.com/RecursiveIntell/agent-graph-mcp"
homepage = "https://github.com/RecursiveIntell/agent-graph-mcp"
documentation = "https://docs.rs/agent-graph-mcp"
readme = "README.md"
keywords = ["mcp", "agent", "graph", "workflow", "orchestration"]
categories = ["development-tools", "asynchronous"]

[dependencies]
ri-agent-graph = "=0.2.4"
llm-pipeline = { version = "=0.2.1", features = ["openai"] }
llm-tool-runtime = "0.1"
async-trait = "0.1"
rmcp = { version = "1", features = ["server", "transport-io"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
reqwest = "0.12"
libc = "0.2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
provekv = { git = "https://github.com/RecursiveIntell/proveKV.git", rev = "8dd2bd4ce6ee9c2247f47823151b185a5c5511b9", optional = true }
blake3 = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
regex = "1.11"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = ["provekv"]
provekv = ["dep:provekv", "dep:blake3", "dep:rand"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "agent-graph-mcp"
path = "src/main.rs"

[[bin]]
name = "agent-graph-mcpd"
path = "src/bin/agent-graph-mcpd.rs"

# Startup hashes the actual executable before opening the listener. Optimize the
# SHA implementation in debug builds too; otherwise large debug images exhaust
# bounded concurrent-startup tests doing unoptimized compression rounds.
[profile.dev.package.sha2]
opt-level = 3

# Dependency-owned patches are not inherited. Admit both reviewed simba versions
# explicitly at the exact same source revision as provekv.
[patch.crates-io]
simba08 = { package = "simba", version = "=0.8.1", git = "https://github.com/RecursiveIntell/proveKV.git", rev = "8dd2bd4ce6ee9c2247f47823151b185a5c5511b9" }
simba09 = { package = "simba", version = "=0.9.1", git = "https://github.com/RecursiveIntell/proveKV.git", rev = "8dd2bd4ce6ee9c2247f47823151b185a5c5511b9" }

